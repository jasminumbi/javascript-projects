<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Astronauts</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script src="script.js"></script>
    <script>
      window.addEventListener("load", function() {
        fetch("https://handlers.education.launchcode.org/static/astronauts.json").then(function (response) {
          response.json().then(function (json) {
            for (let i = 0; i < json.length; i++);
            const div = document.getElementById('container');
            div.innerHTML = `
            <div class="astronaut"> 
              <div class="bio">
                <h3>${json[0].firstName} ${json[0].lastName}</h3>
                <ul>
                  <li>Hours in space: ${json[0].hoursInSpace}</li>
                  <li>Active: ${json[0].active}</li>
                  <li>Skills: ${json[0].skills}</li>
                  </ul>
                </div>
                <img class="avatar" src="${json[0].picture}"
            </div>
            `;
          })
        }
      )
      })
    </script>
    <h1>Astronauts</h1>
    <div id="container">
        <!-- List of astronauts will be added here dynamically -->
    </div>
  </body>
</html>
